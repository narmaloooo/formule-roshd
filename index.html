<style>
/* VOICE: یک مربی آرام و دقیق؛ کتابچه کار، نه تبلیغ
   IDEA: دفترچه کار یک استودیوی محتوا؛ هر درس یک برگه، هر پرامپت یک کارت ابزار
   PICTURE: پله‌های ریلز که مثل یک منحنی رشد بالا می‌روند
   COLOUR and TYPE: سبز عمیق «رشد» + کاغذی روشن + یک مرجانی تیز؛ Vazirmatn
   LAYOUT: یک ستون موبایل، نوار پایین، کارت‌های تمیز با فاصله زیاد */
:root{--bg:#F2F5F0;--card:#FFFFFF;--ink:#10221A;--mute:#56685E;--line:#DCE5DD;--brand:#0E3D2F;--brandInk:#F2F5F0;--sage:#D5EADB;--sage2:#EAF4ED;--acc:#E8572E;--accSoft:#FDEBE3;--warn:#FFF3E6;--warnLine:#F2C79B;--shadow:0 1px 2px rgba(16,34,26,.06),0 6px 20px rgba(16,34,26,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A1511;--card:#11201A;--ink:#E6EFE9;--mute:#9BB0A4;--line:#213529;--brand:#0F2C21;--brandInk:#E6EFE9;--sage:#1C3A2C;--sage2:#142A20;--acc:#FF7A52;--accSoft:#3A1F16;--warn:#2E2316;--warnLine:#6B4A26;--shadow:none}}
:root[data-theme=dark]{--bg:#0A1511;--card:#11201A;--ink:#E6EFE9;--mute:#9BB0A4;--line:#213529;--brand:#0F2C21;--brandInk:#E6EFE9;--sage:#1C3A2C;--sage2:#142A20;--acc:#FF7A52;--accSoft:#3A1F16;--warn:#2E2316;--warnLine:#6B4A26;--shadow:none}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.85 Vazirmatn,"Vazir",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{line-height:1.35;margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:800}h2{font-size:21px;font-weight:800}h3{font-size:18px;font-weight:700;margin:26px 0 8px}
p{margin:0 0 14px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.top{position:-webkit-sticky;position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brandInk);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:36px}
.top b{font-weight:800;font-size:17px}
.top .back{background:none;border:0;color:inherit;padding:6px;margin-inline-start:-6px;display:flex;cursor:pointer;border-radius:10px}
.top .sp{flex:1}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap}
main{padding:18px 0 calc(96px + env(safe-area-inset-bottom))}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.tabs a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;font-size:12px;color:var(--mute);padding:6px 2px;border-radius:12px;min-height:48px}
.tabs a.on{color:var(--brand);font-weight:700}
:root[data-theme=dark] .tabs a.on{color:#9FE0BC}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tabs a.on{color:#9FE0BC}}
.tabs svg{width:22px;height:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 0 14px;box-shadow:var(--shadow)}
.hero{background:var(--brand);color:var(--brandInk);border-radius:22px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
.hero .k{opacity:.8;font-size:14px}
.hero h1{font-size:30px;margin:4px 0 10px}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:14px;border:0;padding:12px 16px;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;text-align:center;line-height:1.5}
.btn.p{background:var(--acc);color:#fff}
.btn.s{background:var(--sage);color:var(--ink)}
.btn.g{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{min-height:42px;font-size:14px;padding:8px 12px;width:auto}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.stack>*+*{margin-top:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:92px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:15px;margin-bottom:2px}
.tile span{font-size:13px;color:var(--mute);line-height:1.6;display:block}
.list a.item{display:flex;gap:12px;align-items:center;text-decoration:none;padding:14px 4px;border-top:1px solid var(--line)}
.list a.item:first-child{border-top:0}
.dot{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--sage2);color:var(--mute);border:1.5px solid var(--line)}
.dot.ok{background:var(--brand);color:#fff;border-color:var(--brand)}
.item .tt{font-weight:700;font-size:15px;line-height:1.6}
.item .ss{font-size:13px;color:var(--mute);line-height:1.6}
.mute{color:var(--mute)}.small{font-size:13px}
.mh{margin:22px 4px 10px}
.mh h2{font-size:19px}.mh p{color:var(--mute);font-size:14px;margin:2px 0 0}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.lbar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}.lbar i{display:block;height:100%;background:var(--brand)}
article{font-size:17px}
article ol{list-style-type:persian}
article ul,article ol{padding-right:22px;padding-inline-start:22px;margin:0 0 16px}
article li{margin:0 0 8px}
article strong{font-weight:800}
.box{border-radius:14px;padding:14px 16px;margin:16px 0;font-size:16px}
.box p:last-child,.box ul:last-child,.box ol:last-child{margin-bottom:0}
.tip{background:var(--sage2);border:1px solid var(--sage)}
.warnb{background:var(--warn);border:1px solid var(--warnLine)}
.ex{background:var(--card);border:1px dashed var(--mute)}
.ex::before{content:"مثال";display:block;font-size:12px;font-weight:800;color:var(--acc);margin-bottom:4px}
.box .lbl{font-weight:800;font-size:13px;display:block;margin-bottom:2px}
.ex .en{direction:ltr;text-align:left;font-size:14px;line-height:1.7;font-family:ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
table.sc{width:100%;border-collapse:collapse;font-size:13px;line-height:1.6}
table.sc td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.pcard{display:flex;gap:12px;align-items:center;text-decoration:none;background:var(--accSoft);border-radius:14px;padding:12px 14px;margin:14px 0}
.pcard .ic{flex:none;width:38px;height:38px;border-radius:11px;background:var(--acc);display:grid;place-items:center}
.pcard b{display:block;font-size:15px}.pcard span{font-size:13px;color:var(--mute);display:block;line-height:1.6}
label.f{display:block;margin:0 0 14px}
label.f>span{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
label.f>small{display:block;color:var(--mute);font-size:13px;margin:-4px 0 6px;line-height:1.6}
input[type=text],input[type=number],input[inputmode],select,textarea{display:block;width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);min-height:48px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:16px 50%,22px 50%;background-size:6px 6px;background-repeat:no-repeat;padding-left:36px}
textarea{min-height:96px;resize:vertical;line-height:1.7}
.other{margin-top:8px}
.out{min-height:220px;font-size:14px;background:var(--sage2)}
/* ---- lesson visuals ---- */
.rprog{position:fixed;top:0;left:0;right:0;height:3px;z-index:8;pointer-events:none}.rprog i{display:block;height:100%;width:0;background:var(--acc);transition:width .1s linear}

function md(src){var L=src.split('\n'),h='',i=0;
 while(i<L.length){var l=L[i];

  var pm=l.match(/^\[\[p:(\w+)\]\]$/);if(pm){h+=pcardHTML(pm[1]);i++;continue}
  if(/^(\d+\. |- )/.test(l)){var ol=/^\d/.test(l),items=[];
   while(i<L.length&&(/^(\d+\. |- )/.test(L[i])||/^\s{2,}- /.test(L[i]))){var x=L[i];

   var subH=function(it){return it.sub.length?'<ul>'+it.sub.map(function(s){return '<li>'+inline(s)+'</li>'}).join('')+'</ul>':''};
   var splitB=function(t){var m=t.match(/^\*\*(.+?)\*\*\s*[:：]?\s*([\s\S]*)$/);return m?[m[1],m[2]]:null};
   if(ol){h+='<ol class="steps">'+items.map(function(it,k){var b=splitB(it.t);return '<li><span class="sn">'+fa(k+1)+'</span><div>'+(b?'<b class="stt">'+inline(b[0])+'</b>'+(b[1]?'<span>'+inline(b[1])+'</span>':''):inline(it.t))+subH(it)+'</div></li>'}).join('')+'</ol>';continue}

   h+='<ul class="dots">'+items.map(function(it){return '<li>'+inline(it.t)+subH(it)+'</li>'}).join('')+'</ul>';continue}
  var para=[];while(i<L.length&&L[i].trim()&&!/^(## |\[\[p:|ex>|!>|>|\d+\. |- )/.test(L[i])){para.push(L[i]);i++}
  if(para.length>1&&para.every(function(x){return (x.match(/ \| /g)||[]).length>=2})){h+='<table class="sc">'+para.map(function(x){return '<tr>'+x.split(' | ').map(function(c){return '<td>'+inline(c)+'</td>'}).join('')+'</tr>'}).join('')+'</table>';continue}
  if(para.length===1&&/^[A-Za-z]/.test(para[0])){h+='<p class="en">'+inline(para[0])+'</p>';continue}
  if(para.length)h+='<p>'+para.map(inline).join('<br>')+'</p>';else i++}
 return h}

function weekKey(d){d=d||new Date();var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()),dw=(x.getDay()+1)%7;x.setDate(x.getDate()-dw);return dkey(x)} // weeks start on Saturday
function fmtN(n){return n>=10000?fa((n/1000).toFixed(n>=100000?0:1))+'K':fa(Math.round(n))}
function lineChart(vals,col,title){var W=320,H=150,p=26,n=vals.length,mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals);if(mx===mn){mx+=1;mn=Math.max(0,mn-1)}
 var X=function(i){return n===1?W/2:p+(i*(W-2*p)/(n-1))},Y=function(v){return H-24-(v-mn)*(H-50)/(mx-mn)};
 var pts=vals.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)}).join(' ');
 var area='M'+X(0).toFixed(1)+','+(H-24)+' L'+pts.split(' ').join(' L')+' L'+X(n-1).toFixed(1)+','+(H-24)+' Z';
 return '<figure class="vz wch"><div class="vt">'+esc(title)+'</div><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img"><path d="'+area+'" fill="'+col+'" opacity=".12"/>'+(n>1?'<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>':'')+
  vals.map(function(v,i){return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="4.5" fill="'+col+'"/><text x="'+X(i).toFixed(1)+'" y="'+(Y(v)-10).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">'+fmtN(v)+'</text><text x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10.5" fill="var(--mute)">هفته '+fa(i+1)+'</text>'}).join('')+'</svg></figure>'}
function pct(a,b){return a>0?Math.round(100*(b-a)/a):null}
function growthInsights(W){var out=[];if(W.length<2)return out;var f0=W[0].f,f1=W[W.length-1].f,v0=W[0].v,v1=W[W.length-1].v;

 var best=-1,bi=0;for(var i=1;i<W.length;i++){var c=pct(W[i-1].v,W[i].v);if(c!==null&&c>best){best=c;bi=i}}

 return out}
